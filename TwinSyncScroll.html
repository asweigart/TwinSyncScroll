<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="TwinSyncScroll is an offline side-by-side text editor with independent scrolling and synchronized scrolling from the center divider.">
  <meta name="application-name" content="TwinSyncScroll">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117">

  <meta property="og:title" content="TwinSyncScroll">
  <meta property="og:description" content="Compare and manually align two text documents with independent panes and synchronized center scrolling. Works offline in one HTML file.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://inventwithpython.com/twinsyncscroll">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="TwinSyncScroll logo showing two text panes separated by synchronized scroll arrows">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TwinSyncScroll">
  <meta name="twitter:description" content="Offline side-by-side text editing with independent and synchronized scrolling.">
  <meta name="twitter:image" content="https://inventwithpython.com/twinsyncscroll/TwinSyncScroll-og-preview.png">

  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2213%22%20fill%3D%22%231f6feb%22%2F%3E%0A%3Crect%20x%3D%229%22%20y%3D%2211%22%20width%3D%2218%22%20height%3D%2242%22%20rx%3D%223%22%20fill%3D%22%23ffffff%22%20opacity%3D%22.96%22%2F%3E%0A%3Crect%20x%3D%2237%22%20y%3D%2211%22%20width%3D%2218%22%20height%3D%2242%22%20rx%3D%223%22%20fill%3D%22%23ffffff%22%20opacity%3D%22.96%22%2F%3E%0A%3Cpath%20d%3D%22M14%2020h8M14%2026h8M14%2032h8M14%2038h8M42%2020h8M42%2026h8M42%2032h8M42%2038h8%22%20stroke%3D%22%231f6feb%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%0A%3Cpath%20d%3D%22M32%2017v30M28.5%2021%2032%2017l3.5%204M28.5%2043%2032%2047l3.5-4%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E">
  <title>TwinSyncScroll</title>

  <style>
    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --panel-subtle: #f6f8fa;
      --text: #1f2328;
      --muted: #636c76;
      --border: #d0d7de;
      --border-strong: #afb8c1;
      --accent: #0969da;
      --accent-soft: rgba(9, 105, 218, .18);
      --danger: #cf222e;
      --selection: rgba(9, 105, 218, .24);
      --drop: rgba(9, 105, 218, .10);
      --shadow: rgba(31, 35, 40, .12);
      --editor-pad-y: 9px;
      --editor-pad-x: 10px;
      --line-height: 20px;
      --font-size: 13px;
      --split: 50%;

      /* Prism token colors are deliberately weight-neutral so overlay glyph widths match the textarea. */
      --tok-comment: #6e7781;
      --tok-punctuation: #57606a;
      --tok-property: #953800;
      --tok-string: #0a3069;
      --tok-number: #0550ae;
      --tok-keyword: #cf222e;
      --tok-function: #8250df;
      --tok-operator: #116329;
      --tok-class: #953800;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-subtle: #0d1117;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --border-strong: #484f58;
        --accent: #58a6ff;
        --accent-soft: rgba(88, 166, 255, .18);
        --danger: #ff7b72;
        --selection: rgba(88, 166, 255, .28);
        --drop: rgba(88, 166, 255, .10);
        --shadow: rgba(0, 0, 0, .35);
        --tok-comment: #8b949e;
        --tok-punctuation: #c9d1d9;
        --tok-property: #ffa657;
        --tok-string: #a5d6ff;
        --tok-number: #79c0ff;
        --tok-keyword: #ff7b72;
        --tok-function: #d2a8ff;
        --tok-operator: #7ee787;
        --tok-class: #ffa657;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      min-width: 300px;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    button, select, input[type="text"] {
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
    }

    button {
      min-width: 30px;
      min-height: 30px;
      padding: 4px 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    button:hover { background: var(--panel-subtle); border-color: var(--border-strong); }
    button:active { transform: translateY(1px); }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .icon {
      width: 16px;
      height: 16px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .appbar {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 650;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .brand svg { width: 25px; height: 25px; flex: 0 0 auto; }
    .appbar-spacer { flex: 1; }

    .ui-language { max-width: 180px; min-height: 30px; padding: 3px 24px 3px 7px; }
    .share-button { gap: 6px; white-space: nowrap; }

    #workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, var(--split)) 42px minmax(0, 1fr);
      overflow: hidden;
    }

    .pane {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      overflow: hidden;
    }

    .pane:focus-within { box-shadow: inset 0 0 0 1px var(--accent); z-index: 2; }

    .pane.drag-over::after {
      content: attr(data-drop-label);
      position: absolute;
      inset: 7px;
      z-index: 30;
      display: grid;
      place-items: center;
      border: 2px dashed var(--accent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel) 86%, var(--accent));
      color: var(--text);
      font-weight: 650;
      pointer-events: none;
    }

    .pane-toolbar {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 5px 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .filename {
      flex: 1 1 140px;
      min-width: 90px;
      max-width: 310px;
      height: 30px;
      padding: 4px 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .syntax-select {
      flex: 0 1 auto;
      min-width: 76px;
      max-width: 130px;
      height: 30px;
      padding: 3px 22px 3px 6px;
    }

    .wrap-control {
      height: 30px;
      padding: 0 5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 5px;
      cursor: pointer;
    }

    .wrap-control:hover { color: var(--text); background: var(--panel-subtle); border-color: var(--border); }
    .wrap-control input { margin: 0; accent-color: var(--accent); }

    .search-bar {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-subtle);
    }

    .search-bar[hidden] { display: none; }

    .search-bar input[type="text"] {
      min-width: 70px;
      height: 29px;
      padding: 4px 6px;
    }

    .search-query { flex: 1 1 130px; }
    .replace-query { flex: 1 1 120px; }

    .case-control {
      height: 29px;
      padding: 0 5px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      border: 1px solid var(--border);
      border-radius: 5px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .case-control input { margin: 0; accent-color: var(--accent); }

    .editor-viewport {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(42px, auto) minmax(0, 1fr);
      background: var(--panel);
      overflow: hidden;
    }

    .line-numbers {
      position: relative;
      overflow: hidden;
      background: var(--panel-subtle);
      border-inline-end: 1px solid var(--border);
      color: var(--muted);
      font: var(--font-size)/var(--line-height) ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      text-align: end;
      user-select: none;
      cursor: default;
    }

    .line-numbers-inner {
      position: absolute;
      inset: 0 0 auto 0;
      padding-top: var(--editor-pad-y);
      will-change: transform;
    }

    .line-number {
      height: var(--line-height);
      min-height: var(--line-height);
      padding-inline: 7px;
      overflow: hidden;
      white-space: nowrap;
    }

    .code-stack {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--panel);
    }

    .highlight-layer,
    .editor-input,
    .editor-measure {
      margin: 0;
      border: 0;
      tab-size: 4;
      font: var(--font-size)/var(--line-height) ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-variant-ligatures: none;
      letter-spacing: 0;
      word-spacing: 0;
    }

    .highlight-layer {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      min-width: 100%;
      min-height: 100%;
      padding: var(--editor-pad-y) var(--editor-pad-x);
      overflow: visible;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      color: var(--text);
      background: transparent;
      pointer-events: none;
      box-sizing: border-box;
      will-change: transform;
    }

    .highlight-layer code { font: inherit; white-space: inherit; }

    .editor-input {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: var(--editor-pad-y) var(--editor-pad-x);
      resize: none;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      color: transparent;
      -webkit-text-fill-color: transparent;
      caret-color: var(--text);
      background: transparent;
      outline: 0;
      box-shadow: none;
      border-radius: 0;
    }

    .editor-input::selection {
      background: var(--selection);
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    .editor-measure {
      position: absolute;
      z-index: -10;
      top: 0;
      left: 0;
      visibility: hidden;
      pointer-events: none;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .measure-line {
      display: block;
      min-height: var(--line-height);
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .pane.nowrap .highlight-layer,
    .pane.nowrap .editor-input,
    .pane.nowrap .editor-measure,
    .pane.nowrap .measure-line {
      white-space: pre;
      overflow-wrap: normal;
    }

    .pane-stats {
      flex: 0 0 auto;
      min-height: 24px;
      padding: 3px 7px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      background: var(--panel-subtle);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #divider {
      position: relative;
      z-index: 4;
      min-width: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--panel-subtle);
      border-inline: 1px solid var(--border);
      cursor: col-resize;
      touch-action: none;
      user-select: none;
    }

    #divider:hover { background: var(--accent-soft); }

    .divider-grip {
      display: grid;
      gap: 3px;
      color: var(--muted);
      pointer-events: none;
    }

    .divider-grip::before,
    .divider-grip::after {
      content: "";
      width: 3px;
      height: 22px;
      border-inline: 1px solid currentColor;
    }

    .sync-mark {
      font: 15px/1 ui-monospace, monospace;
      color: var(--accent);
      pointer-events: none;
    }

    /*
     * Divider controls are absolutely positioned so the gutter itself remains one
     * continuous wheel target and drag surface. The long explanatory copy is rendered
     * vertically on desktop to use the narrow gutter without widening the editor split.
     */
    .sync-cursors-button {
      position: absolute;
      top: 5px;
      left: 50%;
      width: 22px;
      min-width: 22px;
      min-height: 0;
      padding: 6px 2px;
      transform: translateX(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 10px;
      line-height: 1.05;
      white-space: nowrap;
    }

    .gutter-instruction {
      position: absolute;
      left: 4px;
      top: 50%;
      max-height: calc(100% - 250px);
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.05;
      letter-spacing: .01em;
      pointer-events: none;
      overflow: hidden;
    }

    #divider .sync-mark {
      position: absolute;
      right: 9px;
      top: calc(50% - 42px);
    }

    #divider .divider-grip {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    #divider .help-button {
      position: absolute;
      right: 3px;
      top: calc(50% + 37px);
    }

    .sync-scroll-buttons {
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: 5px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2px;
    }

    .sync-scroll-button {
      width: 100%;
      min-width: 0;
      min-height: 26px;
      padding: 2px 0;
      font-size: 16px;
      line-height: 1;
    }

    .sync-scroll-button[data-step="10"] {
      font-size: 18px;
      font-weight: 700;
    }

    /* Chevron icons are drawn as strokes rather than font glyphs so their appearance is
       consistent across operating systems and clearly reads as rotated angle brackets. */
    .sync-scroll-button svg {
      display: block;
      width: 18px;
      height: 18px;
      margin: auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .sync-scroll-button[data-step="10"] svg {
      width: 20px;
      height: 20px;
    }

    .help-button {
      min-width: 22px;
      min-height: 22px;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      cursor: help;
    }

    .help-popover {
      position: fixed;
      z-index: 100;
      max-width: min(330px, calc(100vw - 20px));
      padding: 9px 10px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 6px 20px var(--shadow);
      font-size: 12px;
      line-height: 1.4;
    }

    .help-popover[hidden] { display: none; }

    /*
     * Native title tooltips appear at browser-defined timings. Button hints instead
     * use one shared tooltip so the app can guarantee a 500 ms hover/focus delay.
     */
    .button-tooltip {
      position: fixed;
      z-index: 120;
      max-width: min(300px, calc(100vw - 16px));
      padding: 5px 7px;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 4px 14px var(--shadow);
      font-size: 11px;
      line-height: 1.3;
      pointer-events: none;
      white-space: normal;
    }

    .button-tooltip[hidden] { display: none; }

    .footer {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
    }

    .footer a { color: var(--accent); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(42px, env(safe-area-inset-bottom));
      z-index: 200;
      max-width: min(560px, calc(100vw - 24px));
      padding: 8px 11px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 5px 18px var(--shadow);
      font-size: 12px;
      transform: translate(-50%, 12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .14s ease, transform .14s ease;
    }

    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    /* Prism token styling. No font-weight/font-style changes: overlay metrics must remain identical. */
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: var(--tok-comment); }
    .token.punctuation { color: var(--tok-punctuation); }
    .token.property, .token.tag, .token.constant, .token.symbol, .token.deleted { color: var(--tok-property); }
    .token.boolean, .token.number { color: var(--tok-number); }
    .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin, .token.inserted { color: var(--tok-string); }
    .token.operator, .token.entity, .token.url, .language-css .token.string, .style .token.string { color: var(--tok-operator); }
    .token.atrule, .token.attr-value, .token.keyword { color: var(--tok-keyword); }
    .token.function { color: var(--tok-function); }
    .token.regex, .token.important, .token.variable, .token.class-name { color: var(--tok-class); }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media (max-width: 760px) {
      .brand-text { display: none; }
      .share-label { display: none; }
      .ui-language { max-width: 130px; }

      #workspace {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, var(--split)) 42px minmax(0, 1fr);
      }

      #divider {
        min-width: 0;
        min-height: 42px;
        flex-direction: row;
        border-inline: 0;
        border-block: 1px solid var(--border);
        cursor: row-resize;
      }

      .divider-grip { display: flex; gap: 3px; }
      .divider-grip::before, .divider-grip::after {
        width: 22px;
        height: 3px;
        border-inline: 0;
        border-block: 1px solid currentColor;
      }

      .sync-cursors-button {
        top: 50%;
        left: 5px;
        width: auto;
        min-width: 0;
        height: 22px;
        min-height: 22px;
        padding: 2px 6px;
        transform: translateY(-50%);
        writing-mode: horizontal-tb;
      }

      .gutter-instruction {
        left: 145px;
        right: 78px;
        top: 50%;
        max-height: none;
        transform: translateY(-50%);
        writing-mode: horizontal-tb;
        font-size: 8px;
        line-height: 1.1;
        text-align: center;
        overflow: visible;
      }

      #divider .sync-mark,
      #divider .divider-grip {
        display: none;
      }

      #divider .help-button {
        right: 57px;
        top: 50%;
        transform: translateY(-50%);
      }

      .sync-scroll-buttons {
        left: auto;
        right: 4px;
        bottom: 50%;
        width: 104px;
        transform: translateY(50%);
        grid-template-columns: repeat(4, 1fr);
      }

      .sync-scroll-button {
        min-height: 22px;
        font-size: 13px;
      }

      .sync-scroll-button[data-step="10"] {
        font-size: 14px;
      }

      .pane-toolbar { padding-inline: 4px; }
      .filename { flex-basis: 110px; }
      .footer { font-size: 10px; }
    }

    @media (max-width: 480px) {
      .syntax-select { max-width: 94px; }
      .wrap-text { display: none; }
      .search-bar { flex-wrap: wrap; }
      .search-query, .replace-query { flex-basis: 100px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast { transition: none; }
      button:active { transform: none; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand" aria-label="TwinSyncScroll">

    function chooseInitialLanguage(savedLanguage) {
      if (savedLanguage && TRANSLATIONS[savedLanguage]) return savedLanguage;
      const available = Object.keys(TRANSLATIONS);
      for (const candidate of normalizedLocaleCandidates()) {
        const exact = available.find(code => code.toLowerCase() === candidate.toLowerCase());
        if (exact) return exact;
      }
      return 'en';
    }

    function populateLanguageSelect() {
      const select = document.getElementById('uiLanguage');
      select.replaceChildren();
      for (const code of Object.keys(TRANSLATIONS)) {
        const meta = LANGUAGE_CATALOG[code] || { flag: '🌐', name: code, dir: 'ltr' };
        const option = document.createElement('option');
        option.value = code;
        option.textContent = `${meta.flag} ${meta.name}`;
        select.append(option);
      }
      select.value = currentLanguage;
    }

    function applyTranslations() {
      const meta = LANGUAGE_CATALOG[currentLanguage] || LANGUAGE_CATALOG.en;
      document.documentElement.lang = currentLanguage;
      document.documentElement.dir = meta.dir;

      document.querySelectorAll('[data-i18n]').forEach(element => {
        element.textContent = t(element.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
        element.placeholder = t(element.dataset.i18nPlaceholder);
      });
      document.querySelectorAll('[data-i18n-aria-label]').forEach(element => {
        element.setAttribute('aria-label', t(element.dataset.i18nAriaLabel));
      });
      document.querySelectorAll('[data-i18n-title]').forEach(element => {
        const translated = t(element.dataset.i18nTitle);
        if (element.matches('button')) {
          // Suppress native title bubbles so every button follows the same 500 ms delay.
          element.removeAttribute('title');
          element.dataset.tooltip = translated;
          element.setAttribute('aria-label', translated);
        } else {
          element.title = translated;
        }
      });

      document.querySelectorAll('.pane').forEach(pane => {
        pane.dataset.dropLabel = t('dropFile');
      });

      document.getElementById('syncHelpPopover').textContent = t('syncHelp');
      document.getElementById('divider').setAttribute('aria-label', t('dividerLabel'));

      for (const pane of panes) populateSyntaxSelect(pane);
      for (const pane of panes) updateStats(pane);
    }

    function populateSyntaxSelect(pane) {
      const existing = pane.syntaxSelect.value || pane.state.syntax || 'auto';
      pane.syntaxSelect.replaceChildren();
      for (const [value, labelKey] of SYNTAX_MODES) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = t(labelKey);
        pane.syntaxSelect.append(option);
      }
      pane.syntaxSelect.value = SYNTAX_MODES.some(([value]) => value === existing) ? existing : 'auto';
    }

    function safeParseState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch (error) {
        console.warn('TwinSyncScroll: could not restore localStorage state.', error);
        return null;
      }
    }

    const restored = safeParseState();
    currentLanguage = chooseInitialLanguage(restored?.uiLanguage);

    function defaultPaneState() {
      return { text: '', fileName: '', wrap: true, syntax: 'auto' };
    }

    function normalizePaneState(value) {
      const fallback = defaultPaneState();
      return {
        text: typeof value?.text === 'string' ? value.text : fallback.text,
        fileName: typeof value?.fileName === 'string' ? value.fileName : fallback.fileName,
        wrap: typeof value?.wrap === 'boolean' ? value.wrap : fallback.wrap,
        syntax: SYNTAX_MODES.some(([mode]) => mode === value?.syntax) ? value.syntax : fallback.syntax
      };
    }

    const appState = {
      left: normalizePaneState(restored?.left),
      right: normalizePaneState(restored?.right),
      split: Number.isFinite(restored?.split) ? Math.min(.82, Math.max(.18, restored.split)) : .5,
      uiLanguage: currentLanguage
    };

    document.documentElement.style.setProperty('--split', `${appState.split * 100}%`);
    document.getElementById('versionText').textContent = `v${APP_VERSION}`;
    populateLanguageSelect();

    function makePane(root, side) {
      const state = appState[side];
      const pane = {
        root,
        side,
        state,
        filename: root.querySelector('.filename'),
        syntaxSelect: root.querySelector('.syntax-select'),
        wrapCheckbox: root.querySelector('.wrap-checkbox'),
        fileInput: root.querySelector('.file-input'),
        searchBar: root.querySelector('.search-bar'),
        searchQuery: root.querySelector('.search-query'),
        replaceQuery: root.querySelector('.replace-query'),
        matchCase: root.querySelector('.match-case'),
        viewport: root.querySelector('.editor-viewport'),
        gutter: root.querySelector('.line-numbers'),
        gutterInner: root.querySelector('.line-numbers-inner'),
        highlight: root.querySelector('.highlight-layer'),
        code: root.querySelector('.highlight-layer code'),
        measure: root.querySelector('.editor-measure'),
        textarea: root.querySelector('.editor-input'),
        stats: root.querySelector('.pane-stats'),
        lineHeights: [parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--line-height')) || 20],
        lineOffsets: [0, 20],
        renderPending: false,
        geometryPending: false,
        dragDepth: 0,

        // Remember the active caret independently for each pane. This deliberately
        // stores only the user's most recent caret position; Sync Cursors never
        // compares, searches, or otherwise analyzes the two documents against each other.
        lastCaretOffset: 0,
        history: {
          undo: [],
          redo: [],
          lastInputType: '',
          lastInputTime: 0,
          lastSelectionEnd: 0,
          composing: false
        }
      };

      pane.textarea.value = state.text;
      pane.filename.value = state.fileName;
      pane.wrapCheckbox.checked = state.wrap;
      pane.syntaxSelect.value = state.syntax;
      setWrap(pane, state.wrap, false);
      return pane;
    }

    const panes = [
      makePane(document.getElementById('leftPane'), 'left'),
      makePane(document.getElementById('rightPane'), 'right')
    ];

    // Translation application happens after the pane objects exist because syntax
    // selectors are generated from translated labels rather than static markup.
    applyTranslations();

    const buttonTooltip = document.getElementById('buttonTooltip');

    function positionButtonTooltip(button) {
      if (buttonTooltip.hidden || !button) return;
      const gap = 7;
      const margin = 8;
      const rect = button.getBoundingClientRect();

      // Measure after temporarily placing the tooltip at the viewport origin.
      buttonTooltip.style.left = `${margin}px`;
      buttonTooltip.style.top = `${margin}px`;
      const tipRect = buttonTooltip.getBoundingClientRect();

      let left = rect.left + rect.width / 2 - tipRect.width / 2;
      left = Math.max(margin, Math.min(window.innerWidth - tipRect.width - margin, left));

      let top = rect.bottom + gap;
      if (top + tipRect.height > window.innerHeight - margin) {
        top = rect.top - tipRect.height - gap;
      }
      top = Math.max(margin, Math.min(window.innerHeight - tipRect.height - margin, top));

      buttonTooltip.style.left = `${left}px`;
      buttonTooltip.style.top = `${top}px`;
    }

    function showButtonTooltip(button) {
      if (!button.isConnected || !button.dataset.tooltip) return;
      buttonTooltipTarget = button;
      buttonTooltip.textContent = button.dataset.tooltip;
      buttonTooltip.hidden = false;
      button.setAttribute('aria-describedby', 'buttonTooltip');
      positionButtonTooltip(button);
    }

    function scheduleButtonTooltip(button) {
      clearTimeout(buttonTooltipTimer);
      buttonTooltipTarget = button;
      buttonTooltipTimer = setTimeout(() => showButtonTooltip(button), 500);
    }

    function hideButtonTooltip(button = buttonTooltipTarget) {
      clearTimeout(buttonTooltipTimer);
      buttonTooltipTimer = 0;
      if (button) button.removeAttribute('aria-describedby');
      buttonTooltipTarget = null;
      buttonTooltip.hidden = true;
    }

    function installButtonTooltips() {
      document.querySelectorAll('button[data-i18n-title]').forEach(button => {
        button.addEventListener('mouseenter', () => scheduleButtonTooltip(button));
        button.addEventListener('mouseleave', () => hideButtonTooltip(button));
        button.addEventListener('focus', () => scheduleButtonTooltip(button));
        button.addEventListener('blur', () => hideButtonTooltip(button));
        button.addEventListener('pointerdown', () => hideButtonTooltip(button));
      });
    }

    installButtonTooltips();
    window.addEventListener('resize', () => positionButtonTooltip(buttonTooltipTarget));

    function showToast(message, duration = 1700) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), duration);
    }

    function serializeState() {
      return {
        left: {
          text: panes[0].textarea.value,
          fileName: panes[0].filename.value,
          wrap: panes[0].wrapCheckbox.checked,
          syntax: panes[0].syntaxSelect.value
        },
        right: {
          text: panes[1].textarea.value,
          fileName: panes[1].filename.value,
          wrap: panes[1].wrapCheckbox.checked,
          syntax: panes[1].syntaxSelect.value
        },
        split: appState.split,
        uiLanguage: currentLanguage
      };
    }

    function saveStateNow() {
      clearTimeout(saveTimer);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState()));
      } catch (error) {
        console.warn('TwinSyncScroll: localStorage autosave failed.', error);
        if (!storageFailureShown) {
          storageFailureShown = true;
          showToast(t('storageFailed'), 4200);
        }
      }
    }

    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveStateNow, 250);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[character]));
    }

    function languageFromFilename(fileName) {
      const match = /\.([^.\/\\]+)$/.exec(fileName.trim().toLowerCase());
      return match ? EXTENSION_LANGUAGE[match[1]] || null : null;
    }

    function sniffLanguage(text) {
      const sample = text.slice(0, 5000);
      const trimmed = sample.trimStart();
      if (!trimmed) return 'plaintext';
      if (/^<!doctype\s+html\b/i.test(trimmed) || /^<html\b/i.test(trimmed)) return 'html';
      if (/^<\?xml\b/i.test(trimmed)) return 'xml';
      if (/^[\[{]/.test(trimmed)) {
        try { JSON.parse(text); return 'json'; } catch (_) { /* JSON-like content may be another language. */ }
      }
      if (/^#!.*\b(?:bash|sh|zsh)\b/m.test(sample)) return 'bash';
      if (/^#!.*\bpython\b/m.test(sample) || /^(?:from\s+\w+\s+import|import\s+\w+|def\s+\w+\s*\(|class\s+\w+\s*[:(])/m.test(sample)) return 'python';
      if (/^(?:---\s*$|#{1,6}\s+\S|\*\*\S|```)/m.test(sample)) return 'markdown';
      if (/^(?:[\w.-]+:\s*(?:$|[^/{])|---\s*$)/m.test(sample) && !/[{};]/.test(sample)) return 'yaml';
      return 'plaintext';
    }

    function resolvedSyntax(pane) {
      const selected = pane.syntaxSelect.value;
      if (selected !== 'auto') return selected;
      return languageFromFilename(pane.filename.value) || sniffLanguage(pane.textarea.value);
    }

    function updateHighlight(pane) {
      const text = pane.textarea.value;
      if (text.length > MAX_LIVE_HIGHLIGHT_CHARS) {
        pane.code.innerHTML = escapeHtml(text);
        pane.highlight.dataset.paused = 'true';
        return;
      }

      delete pane.highlight.dataset.paused;
      const syntax = resolvedSyntax(pane);
      const prismName = PRISM_LANGUAGE[syntax];
      const grammar = prismName && window.Prism?.languages?.[prismName];

      // Prism.highlight escapes source text as part of tokenization. Plaintext uses
      // our small escape helper so no document content is interpreted as HTML.
      pane.code.innerHTML = grammar
        ? Prism.highlight(text, grammar, prismName)
        : escapeHtml(text);
    }

    function baseLineHeight() {
      const value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--line-height'));
      return Number.isFinite(value) && value > 0 ? value : 20;
    }

    function rebuildLineGeometry(pane) {
      const text = pane.textarea.value;
      const lines = text.split('\n');
      const baseHeight = baseLineHeight();
      const wrap = pane.wrapCheckbox.checked;
      let heights;

      pane.measure.replaceChildren();

      if (wrap) {
        /*
         * Textareas do not expose per-logical-line layout. A hidden mirror using the
         * exact font, tab size, wrapping rules, and content width gives us stable
         * newline-based line heights for gutters and synchronized scrolling.
         */
        const computed = getComputedStyle(pane.textarea);
        const horizontalPadding = parseFloat(computed.paddingLeft) + parseFloat(computed.paddingRight);
        pane.measure.style.width = `${Math.max(1, pane.textarea.clientWidth - horizontalPadding)}px`;

        const fragment = document.createDocumentFragment();
        for (const line of lines) {
          const row = document.createElement('span');
          row.className = 'measure-line';
          // Zero-width space forces an empty logical line to occupy one line-height.
          row.textContent = line.length ? line : '\u200b';
          fragment.append(row);
        }
        pane.measure.append(fragment);
        heights = Array.from(pane.measure.children, row => Math.max(baseHeight, row.getBoundingClientRect().height));
      } else {
        heights = new Array(lines.length).fill(baseHeight);
      }

      pane.lineHeights = heights;
      pane.lineOffsets = new Array(heights.length + 1);
      pane.lineOffsets[0] = 0;
      for (let index = 0; index < heights.length; index++) {
        pane.lineOffsets[index + 1] = pane.lineOffsets[index] + heights[index];
      }

      const numberFragment = document.createDocumentFragment();
      for (let index = 0; index < lines.length; index++) {
        const number = document.createElement('div');
        number.className = 'line-number';
        number.textContent = String(index + 1);
        number.style.height = `${heights[index]}px`;
        numberFragment.append(number);
      }
      pane.gutterInner.replaceChildren(numberFragment);
      pane.gutter.style.minWidth = `${Math.max(42, String(lines.length).length * 8 + 18)}px`;
    }

    function syncOverlayScroll(pane) {
      const { scrollLeft, scrollTop } = pane.textarea;
      pane.highlight.style.transform = `translate(${-scrollLeft}px, ${-scrollTop}px)`;
      pane.gutterInner.style.transform = `translateY(${-scrollTop}px)`;
    }

    function refreshHighlightWidth(pane) {
      if (pane.wrapCheckbox.checked) {
        /*
         * Match the textarea's actual scrollport width, not the surrounding stack.
         * A textarea with a classic vertical scrollbar has a smaller clientWidth;
         * leaving the highlight layer at min-width: 100% makes it wrap later than
         * the editable text and causes mouse selections to appear offset.
         */
        pane.highlight.style.minWidth = '0';
        pane.highlight.style.width = `${pane.textarea.clientWidth}px`;
      } else {
        // In no-wrap mode the overlay may grow horizontally with the document.
        pane.highlight.style.minWidth = '100%';
        pane.highlight.style.width = 'max-content';
      }
    }

    function renderPaneNow(pane) {
      pane.renderPending = false;
      refreshHighlightWidth(pane);
      updateHighlight(pane);
      rebuildLineGeometry(pane);
      syncOverlayScroll(pane);
      updateStats(pane);
    }

    function scheduleRender(pane) {
      if (pane.renderPending) return;
      pane.renderPending = true;
      requestAnimationFrame(() => renderPaneNow(pane));
    }

    function scheduleGeometryRefresh(pane) {
      if (pane.geometryPending) return;
      pane.geometryPending = true;
      requestAnimationFrame(() => {
        pane.geometryPending = false;
        refreshHighlightWidth(pane);
        rebuildLineGeometry(pane);
        syncOverlayScroll(pane);
      });
    }

    function setWrap(pane, enabled, persist = true) {
      pane.wrapCheckbox.checked = enabled;
      pane.root.classList.toggle('nowrap', !enabled);
      pane.textarea.wrap = enabled ? 'soft' : 'off';
      if (persist) scheduleSave();
      scheduleRender(pane);
    }

    function cursorInfo(textarea) {
      const start = textarea.selectionStart ?? 0;
      const end = textarea.selectionEnd ?? start;
      const before = textarea.value.slice(0, start);
      const previousNewline = before.lastIndexOf('\n');
      return {
        line: 1 + (before.match(/\n/g)?.length || 0),
        column: start - previousNewline,
        selection: Math.abs(end - start)
      };
    }

    function updateStats(pane) {
      const text = pane.textarea.value;
      const cursor = cursorInfo(pane.textarea);
      const lineCount = text.split('\n').length;
      pane.stats.textContent = t('stats', {
        line: cursor.line,
        column: cursor.column,
        lines: lineCount,
        chars: text.length,
        selection: cursor.selection
      });
      pane.stats.title = pane.highlight.dataset.paused === 'true' ? t('highlightPaused') : pane.stats.textContent;
    }

    function snapshot(pane) {
      return {
        value: pane.textarea.value,
        start: pane.textarea.selectionStart,
        end: pane.textarea.selectionEnd,
        direction: pane.textarea.selectionDirection
      };
    }

    function sameSnapshot(a, b) {
      return !!a && !!b && a.value === b.value && a.start === b.start && a.end === b.end;
    }

    function pushUndoSnapshot(pane) {
      const current = snapshot(pane);
      const stack = pane.history.undo;
      if (!sameSnapshot(stack[stack.length - 1], current)) {
        stack.push(current);
        if (stack.length > MAX_HISTORY) stack.shift();
      }
      pane.history.redo.length = 0;
    }

    function restoreSnapshot(pane, value) {
      pane.history.lastInputType = '';
      pane.textarea.value = value.value;
      pane.textarea.setSelectionRange(value.start, value.end, value.direction || 'none');
      pane.textarea.focus();
      scheduleRender(pane);
      scheduleSave();
    }

    function undo(pane) {
      const previous = pane.history.undo.pop();
      if (!previous) return;
      pane.history.redo.push(snapshot(pane));
      restoreSnapshot(pane, previous);
    }

    function redo(pane) {
      const next = pane.history.redo.pop();
      if (!next) return;
      pane.history.undo.push(snapshot(pane));
      restoreSnapshot(pane, next);
    }

    function beforeInput(pane, event) {
      if (event.inputType === 'historyUndo') {
        event.preventDefault();
        undo(pane);
        return;
      }
      if (event.inputType === 'historyRedo') {
        event.preventDefault();
        redo(pane);
        return;
      }
      if (pane.history.composing) return;

      const now = performance.now();
      const type = event.inputType || '';
      const groupableType = type === 'insertText' || type === 'deleteContentBackward' || type === 'deleteContentForward';
      const canGroup = groupableType &&
        type === pane.history.lastInputType &&
        now - pane.history.lastInputTime < 650 &&
        pane.textarea.selectionStart === pane.history.lastSelectionEnd;

      if (!canGroup) pushUndoSnapshot(pane);
      pane.history.lastInputType = type;
      pane.history.lastInputTime = now;
    }

    function afterTextInput(pane) {
      pane.history.lastSelectionEnd = pane.textarea.selectionEnd;
      scheduleRender(pane);
      scheduleSave();
    }

    function selectAll(pane) {
      pane.textarea.focus();
      pane.textarea.select();
      updateStats(pane);
    }

    async function loadFileIntoPane(pane, file) {
      if (!file) return;
      try {
        const text = await file.text();
        pushUndoSnapshot(pane);
        pane.textarea.value = text;
        pane.textarea.setSelectionRange(0, 0);
        pane.filename.value = file.name || '';
        pane.syntaxSelect.value = 'auto';
        pane.textarea.scrollTop = 0;
        pane.textarea.scrollLeft = 0;
        pane.history.lastInputType = '';
        scheduleRender(pane);
        scheduleSave();
        pane.textarea.focus();
        showToast(t('fileLoaded', { name: file.name || t('untitledPlaceholder') }));
      } catch (error) {
        console.warn('TwinSyncScroll: file read failed.', error);
        showToast(t('fileReadError'), 3000);
      } finally {
        pane.fileInput.value = '';
      }
    }

    function downloadPane(pane) {
      const fallback = pane.side === 'left' ? 'left.txt' : 'right.txt';
      const name = pane.filename.value.trim() || fallback;
      const blob = new Blob([pane.textarea.value], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = name;
      anchor.style.display = 'none';
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      showToast(t('saved', { name }));
    }

    function normalizedSearchSource(pane) {
      const query = pane.searchQuery.value;
      const value = pane.textarea.value;
      if (pane.matchCase.checked) return { query, value };
      return { query: query.toLocaleLowerCase(), value: value.toLocaleLowerCase() };
    }

    function findMatch(pane, direction) {
      const queryRaw = pane.searchQuery.value;
      if (!queryRaw) return false;
      const { query, value } = normalizedSearchSource(pane);
      let index = -1;

      if (direction > 0) {
        const startAt = pane.textarea.selectionEnd;
        index = value.indexOf(query, startAt);
        if (index < 0 && startAt > 0) index = value.indexOf(query, 0);
      } else {
        const startAt = Math.max(0, pane.textarea.selectionStart - 1);
        index = value.lastIndexOf(query, startAt);
        if (index < 0) index = value.lastIndexOf(query);
      }

      if (index < 0) {
        showToast(t('noMatches'));
        return false;
      }

      pane.textarea.focus();
      pane.textarea.setSelectionRange(index, index + queryRaw.length);
      updateStats(pane);
      return true;
    }

    function currentSelectionMatchesQuery(pane) {
      const query = pane.searchQuery.value;
      if (!query) return false;
      const selected = pane.textarea.value.slice(pane.textarea.selectionStart, pane.textarea.selectionEnd);
      return pane.matchCase.checked
        ? selected === query
        : selected.toLocaleLowerCase() === query.toLocaleLowerCase();
    }

    function replaceOne(pane) {
      if (!currentSelectionMatchesQuery(pane) && !findMatch(pane, 1)) return;
      pushUndoSnapshot(pane);
      const replacement = pane.replaceQuery.value;
      const start = pane.textarea.selectionStart;
      pane.textarea.setRangeText(replacement, start, pane.textarea.selectionEnd, 'select');
      pane.history.lastInputType = '';
      afterTextInput(pane);
      findMatch(pane, 1);
    }

    function replaceAll(pane) {
      const queryRaw = pane.searchQuery.value;
      if (!queryRaw) return;
      const source = pane.textarea.value;
      const replacement = pane.replaceQuery.value;
      const matchCase = pane.matchCase.checked;
      const haystack = matchCase ? source : source.toLocaleLowerCase();
      const needle = matchCase ? queryRaw : queryRaw.toLocaleLowerCase();
      let cursor = 0;
      let count = 0;
      let output = '';

      while (cursor <= source.length) {
        const index = haystack.indexOf(needle, cursor);
        if (index < 0) break;
        output += source.slice(cursor, index) + replacement;
        cursor = index + queryRaw.length;
        count++;
      }

      if (!count) {
        showToast(t('noMatches'));
        return;
      }

      output += source.slice(cursor);
      pushUndoSnapshot(pane);
      pane.textarea.value = output;
      pane.textarea.setSelectionRange(0, 0);
      pane.history.lastInputType = '';
      afterTextInput(pane);
      showToast(t('replacements', { count }));
    }

    function toggleSearch(pane, focusReplace = false) {
      const opening = pane.searchBar.hidden;
      pane.searchBar.hidden = !opening;
      if (opening) {
        const target = focusReplace ? pane.replaceQuery : pane.searchQuery;
        target.focus();
        target.select();
      } else {
        pane.textarea.focus();
      }
      scheduleGeometryRefresh(pane);
    }

    function openSearch(pane, focusReplace = false) {
      if (pane.searchBar.hidden) pane.searchBar.hidden = false;
      const target = focusReplace ? pane.replaceQuery : pane.searchQuery;
      target.focus();
      target.select();
      scheduleGeometryRefresh(pane);
    }

    function logicalScrollPosition(pane) {
      const offsets = pane.lineOffsets;
      const y = Math.max(0, pane.textarea.scrollTop);
      let low = 0;
      let high = Math.max(0, offsets.length - 2);
      while (low <= high) {
        const middle = (low + high) >> 1;
        if (offsets[middle + 1] <= y) low = middle + 1;
        else high = middle - 1;
      }
      const index = Math.min(low, pane.lineHeights.length - 1);
      const height = pane.lineHeights[index] || baseLineHeight();
      const fraction = Math.max(0, Math.min(1, (y - offsets[index]) / height));
      return index + fraction;
    }

    function offsetForLogicalPosition(pane, logicalPosition) {
      if (!pane.lineHeights.length) return 0;
      const clamped = Math.max(0, Math.min(pane.lineHeights.length - .0001, logicalPosition));
      const index = Math.floor(clamped);
      const fraction = clamped - index;
      return pane.lineOffsets[index] + fraction * (pane.lineHeights[index] || baseLineHeight());
    }

    function wheelDeltaInLogicalLines(event) {
      if (event.deltaMode === WheelEvent.DOM_DELTA_LINE) return event.deltaY;
      if (event.deltaMode === WheelEvent.DOM_DELTA_PAGE) {
        const referenceHeight = Math.max(1, Math.min(...panes.map(pane => pane.textarea.clientHeight)));
        return event.deltaY * referenceHeight / baseLineHeight();
      }
      return event.deltaY / baseLineHeight();
    }

    function syncScrollByLogicalLines(deltaLines) {
      // Apply the same logical-line delta independently to both panes. This preserves
      // their manual offset while moving them together, just like wheel input in the gutter.
      for (const pane of panes) {
        const nextLogical = logicalScrollPosition(pane) + deltaLines;
        pane.textarea.scrollTop = offsetForLogicalPosition(pane, nextLogical);
        syncOverlayScroll(pane);
      }
    }

    function synchronizedWheel(event) {
      event.preventDefault();
      syncScrollByLogicalLines(wheelDeltaInLogicalLines(event));
    }

    function activeCaretOffset(textarea) {
      const start = textarea.selectionStart ?? 0;
      const end = textarea.selectionEnd ?? start;
      if (start === end) return start;

      // selectionDirection identifies the active edge of a non-collapsed selection.
      return textarea.selectionDirection === 'backward' ? start : end;
    }

    function logicalLineIndexAtOffset(text, offset) {
      let lineIndex = 0;
      const limit = Math.max(0, Math.min(text.length, offset));
      for (let index = 0; index < limit; index++) {
        if (text.charCodeAt(index) === 10) lineIndex++;
      }
      return lineIndex;
    }

    function rememberCaret(pane) {
      // Keep this value even after focus moves to the Sync Cursors button.
      pane.lastCaretOffset = activeCaretOffset(pane.textarea);
    }

    function syncCursorsToTop() {
      for (const pane of panes) {
        /*
         * Each pane is handled independently: its own remembered caret line becomes
         * its own top visible logical line. There is intentionally no comparison,
         * matching, diffing, or shared-line inference between the documents.
         *
         * Geometry can be pending after an edit, wrap toggle, or resize, so rebuild it
         * synchronously before converting that remembered logical line to scroll pixels.
         */
        renderPaneNow(pane);
        const lineIndex = logicalLineIndexAtOffset(pane.textarea.value, pane.lastCaretOffset);
        pane.textarea.scrollTop = pane.lineOffsets[lineIndex] || 0;
        syncOverlayScroll(pane);
      }
    }

    function installPaneEvents(pane) {
      pane.root.querySelector('.open-button').addEventListener('click', () => pane.fileInput.click());
      pane.fileInput.addEventListener('change', () => loadFileIntoPane(pane, pane.fileInput.files?.[0]));
      pane.root.querySelector('.download-button').addEventListener('click', () => downloadPane(pane));
      pane.root.querySelector('.search-button').addEventListener('click', () => toggleSearch(pane));
      pane.root.querySelector('.undo-button').addEventListener('click', () => undo(pane));
      pane.root.querySelector('.redo-button').addEventListener('click', () => redo(pane));
      pane.root.querySelector('.select-all-button').addEventListener('click', () => selectAll(pane));

      pane.root.querySelector('.find-prev').addEventListener('click', () => findMatch(pane, -1));
      pane.root.querySelector('.find-next').addEventListener('click', () => findMatch(pane, 1));
      pane.root.querySelector('.replace-one').addEventListener('click', () => replaceOne(pane));
      pane.root.querySelector('.replace-all').addEventListener('click', () => replaceAll(pane));
      pane.root.querySelector('.close-search').addEventListener('click', () => toggleSearch(pane));

      pane.searchQuery.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          findMatch(pane, event.shiftKey ? -1 : 1);
        } else if (event.key === 'Escape') {
          event.preventDefault();
          toggleSearch(pane);
        }
      });
      pane.replaceQuery.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          replaceOne(pane);
        } else if (event.key === 'Escape') {
          event.preventDefault();
          toggleSearch(pane);
        }
      });

      pane.filename.addEventListener('input', () => {
        if (pane.syntaxSelect.value === 'auto') scheduleRender(pane);
        scheduleSave();
      });
      pane.syntaxSelect.addEventListener('change', () => {
        scheduleRender(pane);
        scheduleSave();
      });
      pane.wrapCheckbox.addEventListener('change', () => setWrap(pane, pane.wrapCheckbox.checked));

      pane.textarea.addEventListener('beforeinput', event => beforeInput(pane, event));
      pane.textarea.addEventListener('input', () => afterTextInput(pane));
      pane.textarea.addEventListener('compositionstart', () => {
        if (!pane.history.composing) pushUndoSnapshot(pane);
        pane.history.composing = true;
      });
      pane.textarea.addEventListener('compositionend', () => {
        pane.history.composing = false;
        pane.history.lastInputType = '';
        afterTextInput(pane);
      });
      pane.textarea.addEventListener('scroll', () => syncOverlayScroll(pane), { passive: true });
      const rememberCaretAndUpdateStats = () => {
        rememberCaret(pane);
        updateStats(pane);
      };
      pane.textarea.addEventListener('focus', rememberCaretAndUpdateStats);
      pane.textarea.addEventListener('keyup', rememberCaretAndUpdateStats);
      pane.textarea.addEventListener('mouseup', rememberCaretAndUpdateStats);
      pane.textarea.addEventListener('click', rememberCaretAndUpdateStats);
      pane.textarea.addEventListener('select', rememberCaretAndUpdateStats);
      pane.textarea.addEventListener('input', rememberCaret);

      pane.textarea.addEventListener('keydown', event => {
        const mod = event.ctrlKey || event.metaKey;
        if (!mod) return;
        const key = event.key.toLowerCase();
        if (key === 'o') {
          event.preventDefault();
          pane.fileInput.click();
        } else if (key === 's') {
          event.preventDefault();
          downloadPane(pane);
        } else if (key === 'f') {
          event.preventDefault();
          openSearch(pane, false);
        } else if (key === 'h') {
          event.preventDefault();
          openSearch(pane, true);
        } else if (key === 'z' && !event.shiftKey) {
          event.preventDefault();
          undo(pane);
        } else if ((key === 'z' && event.shiftKey) || key === 'y') {
          event.preventDefault();
          redo(pane);
        }
      });

      // Scrolling over the gutter is treated like scrolling over its textarea; this
      // avoids a dead wheel zone while preserving independent pane scrolling.
      pane.gutter.addEventListener('wheel', event => {
        event.preventDefault();
        pane.textarea.scrollTop += event.deltaY;
        pane.textarea.scrollLeft += event.deltaX;
      }, { passive: false });

      pane.root.addEventListener('dragenter', event => {
        if (!event.dataTransfer?.types?.includes('Files')) return;
        pane.dragDepth++;
        pane.root.classList.add('drag-over');
      });
      pane.root.addEventListener('dragover', event => {
        if (!event.dataTransfer?.types?.includes('Files')) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = 'copy';
      });
      pane.root.addEventListener('dragleave', event => {
        if (!event.dataTransfer?.types?.includes('Files')) return;
        pane.dragDepth = Math.max(0, pane.dragDepth - 1);
        if (!pane.dragDepth) pane.root.classList.remove('drag-over');
      });
      pane.root.addEventListener('drop', event => {
        if (!event.dataTransfer?.files?.length) return;
        event.preventDefault();
        pane.dragDepth = 0;
        pane.root.classList.remove('drag-over');
        loadFileIntoPane(pane, event.dataTransfer.files[0]);
      });

      new ResizeObserver(() => scheduleGeometryRefresh(pane)).observe(pane.viewport);
      scheduleRender(pane);
    }

    for (const pane of panes) installPaneEvents(pane);

    const divider = document.getElementById('divider');
    divider.addEventListener('wheel', synchronizedWheel, { passive: false });
    document.getElementById('syncCursorsButton').addEventListener('click', syncCursorsToTop);
    document.getElementById('syncScrollUpTenButton').addEventListener('click', () => syncScrollByLogicalLines(-10));
    document.getElementById('syncScrollUpButton').addEventListener('click', () => syncScrollByLogicalLines(-1));
    document.getElementById('syncScrollDownButton').addEventListener('click', () => syncScrollByLogicalLines(1));
    document.getElementById('syncScrollDownTenButton').addEventListener('click', () => syncScrollByLogicalLines(10));

    function isStacked() {
      return window.matchMedia('(max-width: 760px)').matches;
    }

    function setSplitFromPointer(event) {
      const workspace = document.getElementById('workspace');
      const rect = workspace.getBoundingClientRect();
      const raw = isStacked()
        ? (event.clientY - rect.top) / rect.height
        : (event.clientX - rect.left) / rect.width;
      appState.split = Math.min(.82, Math.max(.18, raw));
      document.documentElement.style.setProperty('--split', `${appState.split * 100}%`);
      for (const pane of panes) scheduleGeometryRefresh(pane);
      scheduleSave();
    }

    divider.addEventListener('pointerdown', event => {
      if (event.target.closest('button')) return;
      event.preventDefault();
      divider.setPointerCapture(event.pointerId);
      setSplitFromPointer(event);
    });
    divider.addEventListener('pointermove', event => {
      if (!divider.hasPointerCapture(event.pointerId)) return;
      setSplitFromPointer(event);
    });
    divider.addEventListener('pointerup', event => {
      if (divider.hasPointerCapture(event.pointerId)) divider.releasePointerCapture(event.pointerId);
      saveStateNow();
    });
    divider.addEventListener('dblclick', event => {
      if (event.target.closest('button')) return;
      appState.split = .5;
      document.documentElement.style.setProperty('--split', '50%');
      for (const pane of panes) scheduleGeometryRefresh(pane);
      scheduleSave();
    });
    divider.addEventListener('keydown', event => {
      const stacked = isStacked();
      const decrease = stacked ? event.key === 'ArrowUp' : event.key === 'ArrowLeft';
      const increase = stacked ? event.key === 'ArrowDown' : event.key === 'ArrowRight';
      if (!decrease && !increase) return;
      event.preventDefault();
      appState.split = Math.min(.82, Math.max(.18, appState.split + (increase ? .02 : -.02)));
      document.documentElement.style.setProperty('--split', `${appState.split * 100}%`);
      for (const pane of panes) scheduleGeometryRefresh(pane);
      scheduleSave();
    });

    const helpButton = document.getElementById('syncHelpButton');
    const helpPopover = document.getElementById('syncHelpPopover');

    function positionHelpPopover() {
      if (helpPopover.hidden) return;
      const buttonRect = helpButton.getBoundingClientRect();
      const gap = 8;
      helpPopover.style.left = '10px';
      helpPopover.style.top = '10px';
      const popRect = helpPopover.getBoundingClientRect();

      if (isStacked()) {
        let left = buttonRect.left + buttonRect.width / 2 - popRect.width / 2;
        left = Math.max(10, Math.min(window.innerWidth - popRect.width - 10, left));
        let top = buttonRect.bottom + gap;
        if (top + popRect.height > window.innerHeight - 10) top = buttonRect.top - popRect.height - gap;
        helpPopover.style.left = `${left}px`;
        helpPopover.style.top = `${Math.max(10, top)}px`;
      } else {
        let left = buttonRect.right + gap;
        if (left + popRect.width > window.innerWidth - 10) left = buttonRect.left - popRect.width - gap;
        let top = buttonRect.top + buttonRect.height / 2 - popRect.height / 2;
        top = Math.max(10, Math.min(window.innerHeight - popRect.height - 10, top));
        helpPopover.style.left = `${Math.max(10, left)}px`;
        helpPopover.style.top = `${top}px`;
      }
    }

    helpButton.addEventListener('click', event => {
      event.stopPropagation();
      helpPopover.hidden = !helpPopover.hidden;
      if (!helpPopover.hidden) requestAnimationFrame(positionHelpPopover);
    });
    document.addEventListener('click', event => {
      if (!helpPopover.hidden && !helpPopover.contains(event.target) && event.target !== helpButton) {
        helpPopover.hidden = true;
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !helpPopover.hidden) helpPopover.hidden = true;
    });
    window.addEventListener('resize', () => {
      positionHelpPopover();
      divider.setAttribute('aria-orientation', isStacked() ? 'horizontal' : 'vertical');
      for (const pane of panes) scheduleGeometryRefresh(pane);
    }, { passive: true });
    divider.setAttribute('aria-orientation', isStacked() ? 'horizontal' : 'vertical');

    document.getElementById('uiLanguage').addEventListener('change', event => {
      currentLanguage = event.target.value;
      appState.uiLanguage = currentLanguage;
      applyTranslations();
      scheduleSave();
    });

    document.getElementById('shareButton').addEventListener('click', async () => {
      const text = `${t('shareText')} ${SHARE_URL}`;
      try {
        if (navigator.clipboard?.writeText && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const helper = document.createElement('textarea');
          helper.value = text;
          helper.setAttribute('readonly', '');
          helper.style.position = 'fixed';
          helper.style.opacity = '0';
          document.body.append(helper);
          helper.select();
          const copied = document.execCommand('copy');
          helper.remove();
          if (!copied) throw new Error('execCommand(copy) returned false');
        }
        showToast(t('copied'));
      } catch (error) {
        console.warn('TwinSyncScroll: clipboard copy failed.', error);
        showToast(t('copyFailed', { url: SHARE_URL }), 4200);
      }
    });

    window.addEventListener('beforeunload', saveStateNow);
  </script>
</body>
</html>
